name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile Signed APK (v1 + v2 Signature)
        run: gradle assembleDebug --no-daemon

      - name: Rename APK Deliverable
        run: cp app/build/outputs/apk/debug/app-debug.apk studiopro-v2.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: studiopro-signed-apk
          path: studiopro-v2.0.0.apk

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-${{ github.run_number }}
          name: "إصدار التطبيق الموقّع v2.0.0 (#${{ github.run_number }})"
          body: "تم بناء وتوقيع ملف APK تلقائياً بواسطة منصة Web2APK Studio Pro."
          files: studiopro-v2.0.0.apk